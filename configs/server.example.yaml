server:
  listen: "0.0.0.0:443"
  tls_cert: "./cert.pem"
  tls_key: "./key.pem"
  psk: "change-me-high-entropy"
  # Static web root for G2 fallback (no tunnel banner, static only).
  local_static_root: "./fallback"
  dns_upstream:
    - "1.1.1.1:53"
    - "8.8.8.8:53"
  max_streams: 4096
  # Domain blocklist (ads/trackers): suffix match, `full:` prefix = exact.
  # Enforced on DNS answers + OPEN targets; fail closed, loop lives.
  # Master switch: blocklist_enabled: false disables everything.
  blocklist_enabled: true
  blocked_domains:
    - "doubleclick.net"
  # Optional flat file (one suffix per line, `#` comments) with the full
  # category-ads-all DB. Fetch it via scripts/fetch-blocklist.ps1.
  # blocked_domains_file: "assets/blocklist-ads.txt"
