server:
  listen: "0.0.0.0:443"
  tls_cert: "./cert.pem"
  tls_key: "./key.pem"
  psk: "change-me-high-entropy"
  # Static web root for G2 fallback (no tunnel banner, static only).
  local_static_root: "./fallback"
  dns_upstream:
    - "1.1.1.1:53"
    - "8.8.8.8:53"
  # Streams/flows per connection (mux state bound).
  max_streams: 4096
  # Concurrent connections (each costs a thread with a 4 MiB stack).
  # Past this the accept loop drops new sockets instead of queueing them.
  max_connections: 512
  # Egress policy: which *resolved* addresses the server may connect to on the
  # client's behalf (DEC-021). deny_private keeps it off loopback, RFC1918,
  # link-local, CGNAT, ULA and cloud metadata (169.254.169.254). Turn it off
  # only if this server is meant to relay to hosts on its own LAN.
  # allow/deny take CIDRs and are checked in that order (allow wins).
  egress:
    deny_private: true
    allow: []
    deny: []
  # Domain blocklist (ads/trackers): suffix match, `full:` prefix = exact.
  # Enforced on DNS answers + OPEN targets; fail closed, loop lives.
  # Master switch: blocklist_enabled: false disables everything.
  blocklist_enabled: true
  blocked_domains:
    - "doubleclick.net"
  # Optional flat file (one suffix per line, `#` comments) with the full
  # category-ads-all DB. Fetch it via scripts/fetch-blocklist.ps1.
  # blocked_domains_file: "assets/blocklist-ads.txt"
