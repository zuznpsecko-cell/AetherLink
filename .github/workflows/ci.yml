name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fmt-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt and commit
        run: |
          cargo fmt --all
          if git diff --quiet; then echo "::notice::NOTHING_TO_FORMAT"; exit 0; fi
          git config user.name "aetherlink-fmt-bot"
          git config user.email "fmt-bot@users.noreply.github.com"
          git add -A
          git commit -m "style: cargo fmt --all (rustfmt default config)"
          git push origin HEAD:refs/heads/${{ github.head_ref }}
          echo "::notice::FMT_COMMITTED $(git rev-parse --short HEAD)"
