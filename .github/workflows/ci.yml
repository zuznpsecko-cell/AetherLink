name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  probe3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: PROBE audit
        run: |
          set +e
          cargo install cargo-audit --locked --quiet > /tmp/inst.log 2>&1
          echo "install exit=$?"
          cargo audit > /tmp/audit.log 2>&1
          echo "audit exit=$?"
          tail -25 /tmp/audit.log | tr '\n' '|' | head -c 1800
          echo
      - name: PROBE fmt files (all)
        run: |
          set +e
          cargo fmt --all -- --check > /tmp/fmt.log 2>&1
          grep -oP 'Diff in \K[^:]+(?=:)' /tmp/fmt.log | sort -u | sed 's#.*/AetherLink/##' > /tmp/files.txt
          wc -l < /tmp/files.txt
          head -38 /tmp/files.txt | tr '\n' ',' | head -c 1500
          echo
