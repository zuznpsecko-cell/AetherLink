name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  probe4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: PROBE audit
        run: |
          set +e
          cargo install cargo-audit --locked --quiet > /tmp/inst.log 2>&1
          echo "::notice::AUDIT_INSTALL exit=$?"
          cargo audit > /tmp/audit.log 2>&1
          code=$?
          echo "::notice::AUDIT exit=$code"
          grep -E "^(error|Crate:|ID:|Severity:)" /tmp/audit.log | head -8 | while read -r l; do echo "::notice::AUDITLINE $l"; done
      - name: Produce fmt patch
        run: |
          cargo fmt --all
          git diff > /tmp/fmt.patch
          echo "::notice::FMT_PATCH_BYTES $(wc -c < /tmp/fmt.patch)"
          grep -c '^diff --git' /tmp/fmt.patch | sed 's/^/::notice::FMT_FILES /'
      - uses: actions/upload-artifact@v4
        with:
          name: fmt-patch
          path: /tmp/fmt.patch
