name: FMT-COMMIT

on:
  pull_request:

permissions:
  contents: write

jobs:
  fmt-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt and commit
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all; echo "::notice::fmt-exit=$?"
          if git diff --quiet; then echo "::notice::NOTHING_TO_FORMAT"; exit 0; fi
          echo "::notice::files=$(git diff --name-only | tr '\n' ' ')"
          git config user.name "aetherlink-fmt-bot"
          git config user.email "fmt-bot@users.noreply.github.com"
          git add -A
          git commit -m "style: cargo fmt --all (rustfmt default config)"; echo "::notice::commit-exit=$?"
          if git push origin HEAD:refs/heads/${{ github.head_ref }} 2>/tmp/push.err; then
            echo "::notice::FMT_COMMITTED"
          else
            echo "::error title=push-failed::$(head -c 400 /tmp/push.err | sed 's/%/%25/g; s/$/%0A/')"
            exit 1
          fi
