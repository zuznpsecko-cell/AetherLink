name: FMT-DIAG

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fmt-diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Show what rustfmt would change
        run: |
          cargo fmt --all 2>&1 | head -40
          echo "----- exit: $? -----"
          if git diff --quiet; then echo "::notice::NOTHING_TO_FORMAT"; exit 0; fi
          git diff > /tmp/fmt.diff || true
          echo "=== files ==="
          git diff --stat
          # One annotation with percent-encoded newlines: GitHub clips at ~10
          # annotations per step, and the whole point here is the full hunk list.
          BODY=$(head -c 60000 /tmp/fmt.diff | sed 's/%/%25/g; s/$/%0A/')
          echo "::error title=rustfmt-diff::$BODY"
          exit 1
