[workspace]
resolver = "2"
members = [
    "protocol",
    "crates/aetherlink-core",
    "crates/aetherlink-crypto",
    "crates/aetherlink-frame",
    "crates/aetherlink-mux",
    "crates/aetherlink-netstack",
    "crates/aetherlink-ffi",
    "crates/aetherlink-server",
    "crates/aetherlink-client",
]

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AetherLink v1.5 - VPN with userspace network stack, single Rust core + FFI"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"

# TLS
rustls = { version = "0.23", features = ["std", "tls12"] }
rustls-pemfile = "1.0"
webpki = { version = "0.22" }

# Network
smoltcp = { version = "0.10", features = ["std", "socket-tcp", "socket-udp", "socket-icmp", "proto-ipv4", "proto-ipv6"] }
socket2 = "0.5"
ipnet = "2.8"

# FFI
libc = "0.2"
jni = "0.21"

# Testing
hex = "0.4"
pretty_assertions = "1.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = true