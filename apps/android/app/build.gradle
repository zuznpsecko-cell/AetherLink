// AetherLink Android app module. Thin Kotlin UI + VpnService over Rust core.
// minSdk 26 (Android 8.0) per DEC-011; native .so per ABI built with cargo-ndk
// into src/main/jniLibs/<abi>/libaetherlink_core.so (arm64-v8a, armeabi-v7a, x86_64).
plugins {
    id 'com.android.application' version '8.6.1'
    id 'org.jetbrains.kotlin.android' version '2.0.20'
}

android {
    namespace 'link.aether.client'
    compileSdk 35

    defaultConfig {
        applicationId 'link.aether.client'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.5.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests {
            // Robolectric needs merged resources/manifest to boot the app.
            includeAndroidResources = true
        }
    }
}

dependencies {
    // L1 (JVM/Robolectric) harness. Robolectric 4.14.x covers SDK 26..35.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'

    // L2 (device) harness, used from Phase 3 onwards.
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
