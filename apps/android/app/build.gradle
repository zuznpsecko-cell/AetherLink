// AetherLink Android app module. Thin Kotlin UI + VpnService over Rust core.
// minSdk 26 (Android 8.0) per DEC-011; native .so per ABI built with cargo-ndk
// into src/main/jniLibs/<abi>/libaetherlink_core.so (arm64-v8a, armeabi-v7a, x86_64).
plugins {
    id 'com.android.application' version '8.6.1'
    id 'org.jetbrains.kotlin.android' version '2.0.20'
}

android {
    namespace 'link.aether.client'
    compileSdk 35

    defaultConfig {
        applicationId 'link.aether.client'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.5.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}
